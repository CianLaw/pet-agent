name: Build Android APK

# 触发方式：
#  1. 手动：GitHub 仓库 → Actions → Build Android APK → Run workflow
#  2. 发布版本（push v* tag）时自动构建，并把 APK 附加到该 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK packages
        run: |
          SDK="$ANDROID_HOME"
          CMD=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $CMD"
          yes | "$CMD" --licenses > /dev/null 2>&1 || true
          "$CMD" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Capacitor deps
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund

      - name: Sync mobile web into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "doubao-petagent-mobile-v${VER}.apk"
          echo "APK_FILE=doubao-petagent-mobile-v${VER}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doubao-petagent-mobile-apk
          path: doubao-petagent-mobile-*.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" "$APK_FILE" --clobber || echo "release upload skipped (release may not exist)"
