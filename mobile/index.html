<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2133" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>豆包桌宠 · 手机版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景光斑 -->
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <div class="app">
    <!-- 顶栏（安全区内） -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-dot"></span>
        <div class="logo-texts">
          <span class="logo-text">豆包桌宠</span>
          <span class="logo-slogan">AI 桌宠 · 常驻你身边</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="ico-btn" id="btnSkin" aria-label="皮肤">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.6"/><circle cx="17.5" cy="10.5" r="0.6"/><circle cx="8.5" cy="7.5" r="0.6"/><circle cx="6.5" cy="12.5" r="0.6"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.5-1-.3-.3-.5-.6-.5-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5-4.5-9-10-9z"/></svg>
        </button>
        <button class="ico-btn" id="btnSettings" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.9.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9 2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- 宠物区 -->
    <main class="pet-zone" id="petZone">
      <div class="bubble hidden" id="bubble"><span id="bubbleText"></span></div>
      <div class="pet-wrap" id="petWrap">
        <!-- 贴图伪骨骼容器（与桌面/悬浮窗一致：呼吸/眨眼/耳丝带弹簧/motionBus 连续插值） -->
        <div id="petBody">
          <img class="pet-img" id="petImg" alt="桌宠" draggable="false" />
        </div>
        <!-- 头部/眨眼叠加层（兔娘皮肤启用） -->
        <div class="skin-head-group hidden" id="skinHeadGroup">
          <img class="rig-head" id="rigHead" alt="" />
          <img class="rig-blink rig-blink-half" id="rigBlinkHalf" alt="" />
          <img class="rig-blink rig-blink-closed" id="rigBlinkClosed" alt="" />
        </div>
        <div id="partWrap"></div>
        <!-- 物品持有层（喝水/看书/玩手机，过渡进出不凭空出现） -->
        <div class="held-item hidden" id="heldItem"></div>
        <div class="pet-particles" id="particles"></div>
      </div>
    </main>

    <!-- 状态条（安全区下沿） -->
    <section class="stats">
      <div class="stat"><span class="stat-ico" id="sHungerIco">🍖</span><div class="stat-bar"><i id="sHunger"></i></div><b id="tHunger">--</b></div>
      <div class="stat"><span class="stat-ico" id="sMoodIco">😊</span><div class="stat-bar"><i id="sMood"></i></div><b id="tMood">--</b></div>
      <div class="stat"><span class="stat-ico" id="sEnergyIco">⚡</span><div class="stat-bar"><i id="sEnergy"></i></div><b id="tEnergy">--</b></div>
    </section>

    <!-- 底部操作栏（安全区下沿） -->
    <footer class="actions">
      <button class="act" id="actFeed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5c-2.5-3.5-7-1-7 2.5a7 7 0 0 0 14 0c0-3.5-4.5-6-7-2.5z"/><path d="M12 3.5v2"/></svg>
        <span>喂食</span>
      </button>
      <button class="act" id="actPet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="16.5" rx="5.2" ry="3.6"/><ellipse cx="4.6" cy="10" rx="1.7" ry="2.5"/><ellipse cx="12" cy="7.8" rx="1.7" ry="2.5"/><ellipse cx="19.4" cy="10" rx="1.7" ry="2.5"/></svg>
        <span>摸摸</span>
      </button>
      <button class="act act-chat" id="actChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3-.4-4.2-1L3 20l1-4.8A8.5 8.5 0 1 1 21 11.5z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"/></svg>
        <span>聊天</span>
      </button>
      <button class="act" id="actPlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>陪玩</span>
      </button>
    </footer>

    <!-- 聊天面板 -->
    <section class="chat-panel hidden" id="chatPanel">
      <div class="chat-head">
        <span>和豆包桌宠聊天</span>
        <button class="ico-btn" id="chatClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chatInput" type="text" placeholder="说点什么…" autocomplete="off" />
        <button class="chat-send" id="chatSend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </section>

    <!-- 皮肤弹层 -->
    <section class="sheet hidden" id="skinSheet">
      <div class="sheet-mask" id="skinMask"></div>
      <div class="sheet-body" id="skinList"></div>
    </section>

    <!-- 设置弹层 -->
    <section class="sheet hidden" id="setSheet">
      <div class="sheet-mask" id="setMask"></div>
      <div class="sheet-body">
        <div class="sheet-title">设置</div>

        <!-- 关于 / 封面 -->
        <div class="about-row">
          <img class="about-avatar" id="aboutAvatar" src="assets/skin/doubaotu/pet.png" alt="团团" />
          <div class="about-meta">
            <b class="about-name">豆包桌宠</b>
            <span class="about-slogan">AI 桌宠 · 常驻你身边</span>
            <span class="about-ver" id="aboutVer">v5.9.9</span>
          </div>
        </div>

        <!-- 版本与更新 -->
        <div class="update-row" id="updateRow" title="点击查看更新日志">
          <div class="update-info">
            <b id="curVer">当前版本 v5.9.9</b>
            <span id="latestInfo">点击检查，获取最新版本</span>
          </div>
          <div class="update-right">
            <button class="btn-check" id="btnCheckUpdate">检查更新</button>
          </div>
          <span class="update-more">查看日志 ▸</span>
        </div>
        <div class="update-result hidden" id="updateResult"></div>

        <!-- 悬浮窗桌宠 -->
        <div class="sheet-title">悬浮窗桌宠 <span class="sheet-sub">常驻手机桌面</span></div>
        <div class="float-row">
          <div class="float-info">
            <b>团团悬浮在桌面上</b>
            <span id="floatStatus">未开启 · 需授权显示在其他应用上层</span>
          </div>
          <button class="btn-check" id="btnFloat" type="button">开启悬浮窗</button>
        </div>

        <!-- API 配置 -->
        <div class="sheet-title">API 配置 <span class="sheet-sub">用于 AI 聊天（可选）</span></div>
        <label class="field"><span>接口地址</span><input id="setApiBase" type="text" placeholder="https://api.deepseek.com" /></label>
        <label class="field"><span>API Key</span><input id="setApiKey" type="password" placeholder="留空保持不变" /></label>
        <label class="field"><span>对话模型</span><input id="setChatModel" type="text" placeholder="deepseek-chat" /></label>
        <button class="btn-primary" id="setSave">保存</button>
        <div class="set-tip" id="setTip"></div>
      </div>
    </section>
  </div>

  <!-- 更新日志全屏界面 -->
  <section class="sheet hidden" id="logSheet">
    <div class="sheet-mask" id="logMask"></div>
    <div class="sheet-body log-full">
      <div class="log-head">
        <span class="log-title">更新日志</span>
        <span class="log-close" id="logClose">✕</span>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </section>

  <script src="main-pet.js?v=1"></script>
  <script src="app.js"></script>
</body>
</html>
