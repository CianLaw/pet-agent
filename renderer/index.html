<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:; connect-src 'self'" />
  <title>豆包桌宠</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 主气泡（详情面板，点胶囊展开；带关闭钮） -->
  <div id="bubble" class="bubble liquid-glass hidden">
    <span class="glass-blob b1"></span>
    <span class="glass-blob b2"></span>
    <span class="glass-tail"></span>
    <div class="bubble-head">
      <span class="bubble-title">豆包 · 用量</span>
      <span id="balance" class="balance">--</span>
      <span id="bubbleClose" class="chat-close" title="关闭">✕</span>
    </div>
    <div class="bubble-row"><span class="label">今日已用</span><span id="todayCost" class="value">--</span></div>
    <div class="bubble-row"><span class="label">本次消耗</span><span id="lastTokens" class="value">--</span></div>
    <div class="bubble-row"><span class="label">实时速率</span><span id="speed" class="value">--</span></div>
    <div class="bubble-row"><span class="label">缓存命中</span><span id="cacheHit" class="value">--</span></div>
    <div class="bubble-row"><span class="label">当前模型</span><span id="model" class="value">--</span></div>
    <div class="bubble-row"><span class="label">电池</span><span id="battery" class="value">--</span></div>
    <div class="bubble-row"><span class="label">网络</span><span id="network" class="value">--</span></div>
    <div class="bubble-row"><span class="label">内存 / CPU</span><span id="memcpu" class="value">--</span></div>
    <div class="bubble-row"><span class="label">豆包任务</span><span id="doubaoTask" class="value doubao-task">--</span></div>
    <!-- 好感度与状态 -->
    <div class="pet-status">
      <div class="status-head">
        <span class="status-stage" id="petStage">生疏</span>
        <span class="status-aff" id="petAffection">好感 0</span>
      </div>
      <div class="status-bar-row"><span class="status-name">饱食</span><div class="status-bar"><i id="barHunger" style="width:0%"></i></div></div>
      <div class="status-bar-row"><span class="status-name">心情</span><div class="status-bar"><i id="barMood" style="width:0%"></i></div></div>
      <div class="status-bar-row"><span class="status-name">精力</span><div class="status-bar"><i id="barEnergy" style="width:0%"></i></div></div>
    </div>
    <div class="bubble-time" id="time">--</div>
  </div>

  <!-- 宠物头顶台词气泡（纯色质感） -->
  <div id="miniBubble" class="mini-bubble liquid-glass hidden">
    <span class="glass-blob b1"></span>
    <span class="glass-blob b2"></span>
    <span class="glass-tail"></span>
  </div>

  <!-- 迷你状态胶囊：点宠物显示一行关键信息，点它本身展开详情面板 -->
  <div id="statusPill" class="liquid-glass hidden" title="点击查看完整信息">
    <span class="sp-item"><span class="sp-ico">❤️</span><span id="spAff">--</span></span>
    <span class="sp-item" id="spBatWrap"><span class="sp-ico">🔋</span><span id="spBat">--</span></span>
    <span class="sp-item"><span class="sp-ico">📶</span><span id="spNet">--</span></span>
    <span class="sp-item"><span class="sp-ico">💻</span><span id="spCpu">--</span></span>
  </div>

  <!-- AI 聊天小窗（气泡式，最高优先级） -->
  <div id="chatPanel" class="chat-panel liquid-glass hidden">
    <span class="glass-blob b1"></span>
    <span class="glass-blob b2"></span>
    <span class="glass-tail"></span>
    <div class="chat-head">
      <span class="chat-title">和豆包桌宠聊天</span>
      <span id="chatClose" class="chat-close">✕</span>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="说点什么…（回车发送）" />
    </div>
    <div class="chat-hint" id="chatHint"></div>
  </div>

  <!-- 设置面板（磨砂玻璃） -->
  <div id="settingsPanel" class="settings-panel liquid-glass hidden">
    <span class="glass-blob b1"></span>
    <span class="glass-blob b2"></span>
    <div class="settings-head">
      <span class="settings-title">设置</span>
      <span id="settingsClose" class="chat-close">✕</span>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title">API 配置</div>
        <label class="settings-field"><span>接口地址</span><input id="setApiBase" type="text" placeholder="https://api.deepseek.com" /></label>
        <label class="settings-field"><span>API Key</span><input id="setApiKey" type="password" placeholder="留空保持不变" /></label>
        <label class="settings-field"><span>对话模型</span><input id="setChatModel" type="text" placeholder="deepseek-chat" /></label>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">屏幕感知（视觉理解）</div>
        <label class="settings-field settings-switch">
          <span>开启</span>
          <input id="setVisionEnabled" type="checkbox" />
        </label>
        <label class="settings-field"><span>感知间隔（秒）</span><input id="setVisionInterval" type="number" min="10" /></label>
        <label class="settings-field"><span>视觉模型</span><input id="setVisionModel" type="text" placeholder="留空跟随对话模型" /></label>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">版本与更新</div>
        <div class="settings-version">
          <span>当前版本 <b id="setCurrentVersion">--</b></span>
          <span>最新版本 <b id="setLatestVersion">--</b></span>
        </div>
        <div class="settings-update-status" id="setUpdateStatus">尚未检查</div>
        <div class="settings-btns">
          <button id="btnCheckUpdate" class="settings-btn">检查更新</button>
          <button id="btnApplyUpdate" class="settings-btn primary" disabled>立即更新</button>
        </div>
      </div>
      <div class="settings-btns settings-btns-bottom">
        <button id="btnSaveSettings" class="settings-btn primary">保存设置</button>
      </div>
      <div class="settings-tip">保存后需重启生效 · 更新将自动下载并重启，无需重新安装</div>
    </div>
  </div>

  <!-- Live2D 宠物渲染容器 -->
  <div id="pet" class="pet"></div>

  <!-- 贴图皮肤层（切换为贴图皮肤时显示，覆盖 Live2D） -->
  <img id="skinImage" alt="" draggable="false" />

  <!-- 手持物品层：喝水/看书/玩手机等待机行为的"拿出→使用→收回" -->
  <div id="heldItem" class="held-item hidden"></div>

  <!-- 散步精灵层：宠物搬着桌子散步（桌子跟随移动，不凭空消失） -->
  <div id="walkLayer" class="walk-layer hidden">
    <div id="walkTeam" class="walk-team">
      <div id="walkDesk" class="walk-desk">
        <span class="wd-leg wd-l1"></span>
        <span class="wd-leg wd-l2"></span>
      </div>
      <div id="walkSprite" class="walk-sprite"></div>
    </div>
  </div>

  <!-- 睡觉：Zzz + 变暗遮罩 -->
  <div id="sleepOverlay" class="hidden"></div>
  <div id="sleepZzz" class="hidden">💤</div>

  <!-- 拖文件给它吃：拖拽悬停提示 -->
  <div id="dropHint" class="drop-hint hidden">把文件拖给我吃掉吧！(移到废纸篓)</div>

  <!-- 爱心特效层 -->
  <div id="fx"></div>

  <!-- Live2D 引擎（自包含，含运行时与 WebGL） -->
  <script src="vendor/L2Dwidget.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
