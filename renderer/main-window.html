<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:" />
  <title>豆包桌宠 · 主界面</title>
  <link rel="stylesheet" href="main-window.css" />
</head>
<body>
  <!-- 磨砂玻璃背景光斑 -->
  <div class="mw-blob mw-b1"></div>
  <div class="mw-blob mw-b2"></div>

  <div class="mw-shell">
    <!-- 左侧导航 -->
    <nav class="mw-nav">
      <div class="mw-logo">
        <span class="mw-logo-dot"></span>
        豆包桌宠
      </div>
      <div class="mw-nav-item active" data-page="home">
        <svg class="mw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
        首页
      </div>
      <div class="mw-nav-item" data-page="skin">
        <svg class="mw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.6"/><circle cx="17.5" cy="10.5" r="0.6"/><circle cx="8.5" cy="7.5" r="0.6"/><circle cx="6.5" cy="12.5" r="0.6"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.5-1-.3-.3-.5-.6-.5-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5-4.5-9-10-9z"/></svg>
        皮肤
      </div>
      <div class="mw-nav-item" data-page="module">
        <svg class="mw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        模块
      </div>
      <div class="mw-nav-item" data-page="setting">
        <svg class="mw-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-1.9.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3 2 2 0 1 1-2.8-2.8 1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9 2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        设置
      </div>
      <div class="mw-nav-version" id="mwVersion">v--</div>
    </nav>

    <!-- 右侧内容 -->
    <main class="mw-main">
      <!-- 首页 -->
      <section class="mw-page" id="page-home">
        <h2 class="mw-title">我的桌宠</h2>
        <div class="mw-home-card">
          <div class="mw-home-pet">
            <div class="mw-avatar" id="mwAvatar">
              <svg class="mw-ico-paw" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16.5" rx="5.2" ry="3.6"/><ellipse cx="4.6" cy="10" rx="1.7" ry="2.5"/><ellipse cx="12" cy="7.8" rx="1.7" ry="2.5"/><ellipse cx="19.4" cy="10" rx="1.7" ry="2.5"/></svg>
            </div>
            <div class="mw-home-info">
              <div class="mw-stage" id="mwStage">--</div>
              <div class="mw-aff" id="mwAffection">好感 --</div>
            </div>
          </div>
          <div class="mw-bars">
            <div class="mw-bar-row"><span>饱食</span><div class="mw-bar"><i id="mwHunger"></i></div></div>
            <div class="mw-bar-row"><span>心情</span><div class="mw-bar"><i id="mwMood"></i></div></div>
            <div class="mw-bar-row"><span>精力</span><div class="mw-bar"><i id="mwEnergy"></i></div></div>
          </div>
          <div class="mw-home-hint">悬浮窗桌宠常驻桌面，右键可打开本界面、喂食、聊天等</div>
        </div>
      </section>

      <!-- 皮肤 -->
      <section class="mw-page hidden" id="page-skin">
        <h2 class="mw-title">皮肤 <span class="mw-sub">放新皮肤进 skin 文件夹即可显示</span></h2>
        <div class="mw-skin-grid" id="mwSkinGrid"></div>
        <div class="mw-skin-actions">
          <button class="mw-btn" id="btnOpenSkinFolder">打开皮肤文件夹</button>
          <button class="mw-btn" id="btnRefreshSkin">刷新列表</button>
        </div>
      </section>

      <!-- 模块 -->
      <section class="mw-page hidden" id="page-module">
        <h2 class="mw-title">模块开关 <span class="mw-sub">控制桌宠的各个能力</span></h2>
        <div class="mw-module-list" id="mwModuleList"></div>
        <div class="mw-module-tip">部分模块保存后需重启桌宠生效</div>
      </section>

      <!-- 设置 -->
      <section class="mw-page hidden" id="page-setting">
        <h2 class="mw-title">设置</h2>
        <div class="mw-card">
          <div class="mw-section-title">API 配置</div>
          <label class="mw-field"><span>接口地址</span><input id="mwApiBase" type="text" placeholder="https://api.deepseek.com" /></label>
          <label class="mw-field"><span>API Key</span><input id="mwApiKey" type="password" placeholder="留空保持不变" /></label>
          <label class="mw-field"><span>对话模型</span><input id="mwChatModel" type="text" placeholder="deepseek-chat" /></label>
          <div class="mw-row-right"><button class="mw-btn primary" id="btnSaveSettings">保存设置</button></div>
        </div>
        <div class="mw-card">
          <div class="mw-section-title">版本与更新</div>
          <div class="mw-version-line">
            <span>当前 <b id="mwCurVer">--</b></span>
            <span>最新 <b id="mwLatVer">--</b></span>
          </div>
          <div class="mw-update-status" id="mwUpdateStatus">点击「检查更新」获取最新版本</div>
          <div class="mw-row-right">
            <button class="mw-btn" id="btnCheckUpdate">检查更新</button>
            <button class="mw-btn primary" id="btnApplyUpdate" disabled>立即更新</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="main-window.js"></script>
</body>
</html>
